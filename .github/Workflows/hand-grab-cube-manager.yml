# Hand Grab Cube - Professional Project Manager (Advanced)
# --------------------------------------------------------
# Features:
# - Maintenance mode with automatic GitHub Pages deployment
# - Scheduled maintenance
# - Notifications via Slack (optional)
# - Advanced reports and artifacts
# - Build and cleanup options
# - Full menu-driven workflow

name: "Hand Grab Cube Advanced Manager"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action"
        required: true
        default: "status"
        type: choice
        options:
          - maintenance_on
          - maintenance_off
          - report
          - build
          - status
          - update_website
          - clean_builds
          - deploy_live
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2AM UTC for scheduled maintenance

jobs:
  manager:
    name: Hand Grab Cube Menu - ${{ github.event.inputs.action || 'scheduled' }}
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Slack Webhook (optional)
        if: env.SLACK_WEBHOOK != ''
        run: |
          echo "Slack webhook is configured and ready."

      - name: Prepare Folders
        run: |
          mkdir -p website
          mkdir -p website/live
          mkdir -p website/live_backup
          mkdir -p reports
          mkdir -p build_artifacts

      - name: Execute Menu Action
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          ACTION="${{ github.event.inputs.action || 'status' }}"
          WEB_DIR="website"
          LIVE_DIR="$WEB_DIR/live"
          BACKUP_DIR="$WEB_DIR/live_backup"
          MAINT_FILE="$WEB_DIR/index.html"
          STATUS_FILE="$WEB_DIR/status.json"
          REPORT_DIR="reports"

          notify_slack() {
            if [ -n "$SLACK_WEBHOOK" ]; then
              curl -X POST -H 'Content-type: application/json' \
                --data "{\"text\": \"$1\"}" "$SLACK_WEBHOOK" || true
            fi
          }

          # ----------------------------
          # Maintenance ON
          # ----------------------------
          if [[ "$ACTION" == "maintenance_on" ]]; then
            echo "Enabling maintenance mode..."
            echo "MAINTENANCE_MODE=ON" > maintenance.flag

            if [ -d "$LIVE_DIR" ]; then
              rm -rf "$BACKUP_DIR"
              cp -r "$LIVE_DIR/." "$BACKUP_DIR"
              echo "Live site backed up."
            fi

            cat > "$MAINT_FILE" <<'EOL'
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance - Hand Grab Cube</title>
<style>
body { 
  font-family: Arial, sans-serif; 
  background: linear-gradient(135deg, #0b0d10 0%, #1a1c22 100%);
  color: #e6eef6; 
  text-align: center; 
  padding: 100px 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
h1 { 
  font-size: 2.5em; 
  margin-bottom: 0.5em;
  color: #00d1ff;
}
p { 
  font-size: 1.2em; 
  margin-top: 0;
  color: #cfd8dc;
}
.footer { 
  margin-top: 50px; 
  font-size: 0.9em; 
  color: #9fb2c2;
}
</style>
</head>
<body>
<h1>🔧 Site Under Maintenance</h1>
<p>Hand Grab Cube is currently undergoing scheduled maintenance.</p>
<p>We will be back shortly. Thank you for your patience.</p>
<div class="footer">Last updated: $(date -u '+%Y-%m-%d %H:%M UTC')</div>
</body>
</html>
EOL

            echo "{\"status\":\"maintenance\",\"last_updated\":\"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\"}" > "$STATUS_FILE"

            git add "$WEB_DIR" maintenance.flag
            git commit -m "Enable maintenance mode [ci skip]" || echo "No changes to commit"
            git push origin HEAD:gh-pages || git push origin HEAD:main
            notify_slack "✅ Maintenance mode ENABLED for Hand Grab Cube."
            exit 0
          fi

          # ----------------------------
          # Maintenance OFF
          # ----------------------------
          if [[ "$ACTION" == "maintenance_off" ]]; then
            echo "Disabling maintenance mode..."
            rm -f maintenance.flag

            if [ -d "$BACKUP_DIR" ] && [ "$(ls -A $BACKUP_DIR)" ]; then
              rm -rf "$WEB_DIR"/*
              cp -r "$BACKUP_DIR/." "$WEB_DIR/"
              echo "Live site restored from backup."
            else
              echo "<!DOCTYPE html><html><head><title>Hand Grab Cube</title></head><body><h1>Hand Grab Cube Live</h1><p>Welcome back!</p></body></html>" > "$WEB_DIR/index.html"
            fi

            echo "{\"status\":\"live\",\"last_updated\":\"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\"}" > "$STATUS_FILE"

            git add "$WEB_DIR"
            git add maintenance.flag 2>/dev/null || true
            git commit -m "Disable maintenance mode and restore live site [ci skip]" || echo "No changes to commit"
            git push origin HEAD:gh-pages || git push origin HEAD:main
            notify_slack "✅ Maintenance mode DISABLED for Hand Grab Cube. Live site restored."
            exit 0
          fi

          # ----------------------------
          # Generate Advanced Report
          # ----------------------------
          if [[ "$ACTION" == "report" ]]; then
            echo "Generating project report..."
            REPORT="$REPORT_DIR/report-$(date +%Y%m%d-%H%M%S).txt"
            
            {
              echo "Hand Grab Cube Project Report - $(date)"
              echo "========================================"
              echo ""
              echo "Repository Information:"
              echo "  Branch: $(git branch --show-current)"
              echo "  Last commit: $(git log -1 --oneline)"
              echo ""
              echo "File Statistics:"
              echo "  Total files: $(find . -type f -not -path '*/\.*' | wc -l)"
              echo "  JavaScript files: $(find . -name '*.js' -not -path '*/node_modules/*' | wc -l)"
              echo "  Python files: $(find . -name '*.py' | wc -l)"
              echo ""
              echo "Lines of Code:"
              if find . -name '*.js' -not -path '*/node_modules/*' -type f | grep -q .; then
                echo "  JavaScript: $(find . -name '*.js' -not -path '*/node_modules/*' -exec cat {} \; | wc -l) lines"
              fi
              if find . -name '*.py' -type f | grep -q .; then
                echo "  Python: $(find . -name '*.py' -exec cat {} \; | wc -l) lines"
              fi
              echo ""
              echo "Top 5 Largest Files:"
              find . -type f -not -path '*/\.*' -not -path '*/node_modules/*' -exec du -h {} + | sort -rh | head -5
              echo ""
              echo "Recent Commits (last 5):"
              git log -5 --oneline
            } > "$REPORT"
            
            echo "Report saved at $REPORT"
            
            # Upload as artifact
            mkdir -p artifacts
            cp "$REPORT" artifacts/
            
            exit 0
          fi

          # ----------------------------
          # Build Project
          # ----------------------------
          if [[ "$ACTION" == "build" ]]; then
            echo "Building project..."
            
            # Node.js build
            if [ -f package.json ]; then
              echo "Installing Node dependencies..."
              npm ci || npm install
              
              if npm run | grep -q "build"; then
                echo "Running build script..."
                npm run build
              fi
            fi
            
            # Python build
            if [ -f requirements.txt ]; then
              echo "Installing Python dependencies..."
              pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt
            fi
            
            echo "Build complete."
            notify_slack "✅ Hand Grab Cube build completed successfully."
            exit 0
          fi

          # ----------------------------
          # Clean Old Builds
          # ----------------------------
          if [[ "$ACTION" == "clean_builds" ]]; then
            echo "Cleaning build artifacts..."
            rm -rf build_artifacts/*
            rm -rf node_modules/.cache 2>/dev/null || true
            rm -rf dist 2>/dev/null || true
            echo "Build artifacts cleaned."
            notify_slack "🧹 Hand Grab Cube build artifacts cleaned."
            exit 0
          fi

          # ----------------------------
          # Deploy Live Site
          # ----------------------------
          if [[ "$ACTION" == "deploy_live" ]]; then
            echo "Deploying live site..."
            
            # Ensure website directory exists and has content
            if [ ! -d "$WEB_DIR" ] || [ -z "$(ls -A $WEB_DIR)" ]; then
              echo "Error: Website directory is empty or doesn't exist"
              exit 1
            fi
            
            git add "$WEB_DIR"
            git commit -m "Deploy live site [ci skip]" || echo "No changes to commit"
            git push origin HEAD:gh-pages || git push origin HEAD:main
            echo "Live site deployed."
            notify_slack "🚀 Hand Grab Cube live site deployed."
            exit 0
          fi

          # ----------------------------
          # Update Website (alias for deploy_live)
          # ----------------------------
          if [[ "$ACTION" == "update_website" ]]; then
            echo "Updating website..."
            
            if [ ! -d "$WEB_DIR" ] || [ -z "$(ls -A $WEB_DIR)" ]; then
              echo "Error: Website directory is empty or doesn't exist"
              exit 1
            fi
            
            git add "$WEB_DIR"
            git commit -m "Update website [ci skip]" || echo "No changes to commit"
            git push origin HEAD:gh-pages || git push origin HEAD:main
            echo "Website updated."
            notify_slack "📝 Hand Grab Cube website updated."
            exit 0
          fi

          # ----------------------------
          # Status
          # ----------------------------
          if [[ "$ACTION" == "status" ]]; then
            echo "========================================"
            echo "Hand Grab Cube Project Status"
            echo "========================================"
            echo ""
            
            if [ -f maintenance.flag ]; then
              echo "🔧 Maintenance mode: ENABLED"
              cat maintenance.flag
            else
              echo "✅ Project status: LIVE"
            fi
            
            echo ""
            echo "Git Information:"
            echo "  Branch: $(git branch --show-current)"
            echo "  Last commit: $(git log -1 --oneline)"
            echo ""
            
            if [ -f "$STATUS_FILE" ]; then
              echo "Status JSON:"
              cat "$STATUS_FILE"
            fi
            
            echo ""
            echo "========================================"
            exit 0
          fi

          echo "❌ Unknown action: $ACTION"
          exit 1

      - name: Upload Report Artifacts
        if: github.event.inputs.action == 'report'
        uses: actions/upload-artifact@v4
        with:
          name: project-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
