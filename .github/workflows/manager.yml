# Hand Grab Cube - Professional Project Manager (Advanced)
# --------------------------------------------------------
# Features:
# - Maintenance mode with automatic GitHub Pages deployment
# - Scheduled maintenance
# - Notifications via Slack
# - Advanced reports and artifacts
# - Build and cleanup options
# - Full menu-driven workflow

name: "Hand Grab Cube Advanced Manager"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action"
        required: true
        default: "status"
        type: choice
        options:
          - maintenance_on
          - maintenance_off
          - report
          - build
          - status
          - update_website
          - clean_builds
          - deploy_live
  schedule:
    - cron: '0 2 * * 1' # Example: every Monday at 2AM UTC for scheduled maintenance

jobs:
  manager:
    name: Hand Grab Cube Menu - ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Setup Slack Webhook (optional)
        if: env.SLACK_WEBHOOK
        run: |
          echo "Slack webhook is set."

      - name: Prepare Folders
        run: |
          mkdir -p website
          mkdir -p website/live
          mkdir -p website/live_backup
          mkdir -p reports
          mkdir -p build_artifacts

      - name: Execute Menu Action
        shell: bash
        run: |
          ACTION="${{ github.event.inputs.action }}"
          WEB_DIR="website"
          LIVE_DIR="$WEB_DIR/live"
          BACKUP_DIR="$WEB_DIR/live_backup"
          MAINT_FILE="$WEB_DIR/index.html"
          STATUS_FILE="$WEB_DIR/status.json"
          REPORT_DIR="reports"

          notify_slack() {
            if [ ! -z "$SLACK_WEBHOOK" ]; then
              curl -X POST -H 'Content-type: application/json' \
                --data "{\"text\": \"$1\"}" $SLACK_WEBHOOK
            fi
          }

          # ----------------------------
          # Maintenance ON
          # ----------------------------
          if [[ "$ACTION" == "maintenance_on" ]]; then
            echo "Enabling maintenance mode..."
            echo "MAINTENANCE_MODE=ON" > maintenance.flag

            if [ -d "$LIVE_DIR" ]; then
              rm -rf "$BACKUP_DIR"
              cp -r "$LIVE_DIR/." "$BACKUP_DIR"
              echo "Live site backed up."
            fi

            cat > "$MAINT_FILE" <<EOL
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Maintenance - Hand Grab Cube</title>
<style>body{font-family:Arial,sans-serif;background:#f5f5f5;color:#333;text-align:center;padding:100px;}h1{font-size:2.5em;margin-bottom:0.5em;}p{font-size:1.2em;margin-top:0;}.footer{margin-top:50px;font-size:0.9em;color:#666;}</style>
</head>
<body>
<h1>Site Under Maintenance</h1>
<p>Hand Grab Cube is currently undergoing scheduled maintenance.</p>
<p>We will be back shortly.</p>
<div class="footer">Last updated: $(date -u '+%Y-%m-%d %H:%M UTC')</div>
</body></html>
EOL

            echo "{\"status\":\"maintenance\",\"last_updated\":\"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\"}" > "$STATUS_FILE"

            git add "$WEB_DIR"
            git commit -m "Enable maintenance mode [ci skip]" || echo "No changes to commit"
            git push origin HEAD:gh-pages
            notify_slack "Maintenance mode ENABLED for Hand Grab Cube."
            exit 0
          fi

          # ----------------------------
          # Maintenance OFF
          # ----------------------------
          if [[ "$ACTION" == "maintenance_off" ]]; then
            echo "Disabling maintenance mode..."
            rm -f maintenance.flag

            if [ -d "$BACKUP_DIR" ]; then
              rm -rf "$WEB_DIR"/*
              cp -r "$BACKUP_DIR/." "$WEB_DIR/"
              echo "Live site restored from backup."
            else
              echo "<!DOCTYPE html><html><body><h1>Hand Grab Cube Live</h1></body></html>" > "$WEB_DIR/index.html"
            fi

            echo "{\"status\":\"live\",\"last_updated\":\"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\"}" > "$STATUS_FILE"

            git add "$WEB_DIR"
            git commit -m "Disable maintenance mode and restore live site [ci skip]" || echo "No changes to commit"
            git push origin HEAD:gh-pages
            notify_slack "Maintenance mode DISABLED for Hand Grab Cube. Live site restored."
            exit 0
          fi

          # ----------------------------
          # Generate Advanced Report
          # ----------------------------
          if [[ "$ACTION" == "report" ]]; then
            echo "Generating project report..."
            REPORT="$REPORT_DIR/report.txt"
            echo "Hand Grab Cube Project Report - $(date)" > $REPORT
            echo "----------------------------------------" >> $REPORT
            echo "Total files: $(find . -type f | wc -l)" >> $REPORT
            echo "Lines of code (JS): $(find . -name '*.js' | xargs wc -l | tail -1)" >> $REPORT
            echo "Lines of code (Python): $(find . -name '*.py' | xargs wc -l | tail -1)" >> $REPORT
            echo "Top 5 largest files:" >> $REPORT
            find . -type f -exec du -h {} + | sort -rh | head -5 >> $REPORT
            echo "Last commit:" >> $REPORT
            git log -1 >> $REPORT
            echo "Report saved at $REPORT"
            echo "::set-output name=artifact::$REPORT"
            exit 0
          fi

          # ----------------------------
          # Build Project
          # ----------------------------
          if [[ "$ACTION" == "build" ]]; then
            echo "Building project..."
            if [ -f package.json ]; then npm ci && npm run build; fi
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            echo "Build complete."
            exit 0
          fi

          # ----------------------------
          # Clean Old Builds
          # ----------------------------
          if [[ "$ACTION" == "clean_builds" ]]; then
            echo "Cleaning build artifacts..."
            rm -rf build_artifacts/*
            echo "Build artifacts cleaned."
            exit 0
          fi

          # ----------------------------
          # Deploy Live Site
          # ----------------------------
          if [[ "$ACTION" == "deploy_live" ]]; then
            echo "Deploying live site..."
            git add "$WEB_DIR"
            git commit -m "Deploy live site [ci skip]" || echo "No changes to commit"
            git push origin HEAD:gh-pages
            echo "Live site deployed."
            exit 0
          fi

          # ----------------------------
          # Status
          # ----------------------------
          if [[ "$ACTION" == "status" ]]; then
            if [ -f maintenance.flag ]; then
              echo "Maintenance mode: ENABLED"
            else
              echo "Project status: LIVE"
            fi
            echo "Status JSON: $STATUS_FILE"
            exit 0
          fi

          echo "Unknown action: $ACTION"
          exit 1