name: crypt
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      file:
        description: 'File to decrypt (leave empty for whole repo)'
        required: false
        default: ''

jobs:
  encrypt-and-deploy:
    name: Encrypt and Deploy Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Initialize Processing Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write Crypt Script
        env:
          CRYPT_SCRIPT: ${{ secrets.CRYPT_SCRIPT }}
        run: node -e "const fs=require('fs'); fs.writeFileSync('/tmp/crypt.js', process.env.CRYPT_SCRIPT);"

      - name: Decrypt All Files
        if: github.event_name == 'push'
        env:
          IS_DISPATCH: "true"
          DECRYPT_FILE: ""
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: node /tmp/crypt.js

      - name: Deploy Plaintext to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAT }}
          publish_dir: ./
          exclude_assets: '.github'
          force_orphan: true
          commit_message: 'deploy: sync plaintext to GitHub Pages [skip ci]'

      - name: Run Crypt Script
        env:
          DECRYPT_FILE: ${{ github.event.inputs.file || '' }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: node /tmp/crypt.js

      - name: Commit Transformed Repository Tree
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}
          git add .
          if git diff-index --quiet HEAD --; then
            exit 0
          else
            git commit -m "security: polymorphic file structure lockdown cycle completed [skip ci]"
            git push origin main
          fi
